services:

  # ─── BASES DE DATOS ──────────────────────────────────────────────

  mysql:
    image: mysql:8.0
    container_name: tapandchew_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_GATEWAY_DB}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - tapandchew_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: tapandchew_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tapandchew_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7.0
    container_name: tapandchew_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - tapandchew_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MICROSERVICIOS ──────────────────────────────────────────────

  gateway:
    build:
      context: ./services/gateway-auth-service
    container_name: tapandchew_gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_KEY: ${APP_KEY}
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_GATEWAY_DB}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: ${JWT_TTL}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      MS_MENU_URL: ${MS_MENU_URL}
      MS_ORDER_URL: ${MS_ORDER_URL}
      MS_KITCHEN_URL: ${MS_KITCHEN_URL}
      MS_PAYMENT_URL: ${MS_PAYMENT_URL}
      MS_NOTIFICATIONS_URL: ${MS_NOTIFICATIONS_URL}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tapandchew_net

  menu:
    build:
      context: ./services/menu-service
    container_name: tapandchew_menu
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      DEBUG: "False"
      SECRET_KEY: ${JWT_SECRET}
      ALLOWED_HOSTS: localhost,127.0.0.1,menu
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tapandchew_net

  order:
    build:
      context: ./services/order-service
    container_name: tapandchew_order
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      PORT: 8003
      NODE_ENV: production
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/tapandchew_orders?authSource=admin
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - tapandchew_net

  kitchen:
    build:
      context: ./services/kitchen-service
    container_name: tapandchew_kitchen
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      FLASK_APP: run.py
      FLASK_ENV: production
      SECRET_KEY: ${JWT_SECRET}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_KITCHEN_DB}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      ORDER_SERVICE_URL: ${MS_ORDER_URL}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      PORT: 8004
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tapandchew_net

  payment:
    build:
      context: ./services/payment-service
    container_name: tapandchew_payment
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      PORT: 8005
      NODE_ENV: production
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/tapandchew_payments?authSource=admin
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - tapandchew_net

  notifications:
    build:
      context: ./services/notifications-service
    container_name: tapandchew_notifications
    restart: unless-stopped
    ports:
      - "8006:8006"
    environment:
      PORT: 8006
      NODE_ENV: production
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/tapandchew_notifications?authSource=admin
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - tapandchew_net

# ─── VOLÚMENES Y RED ─────────────────────────────────────────────────

volumes:
  mysql_data:
  postgres_data:
  mongo_data:

networks:
  tapandchew_net:
    driver: bridge